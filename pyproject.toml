[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-gw"
version = "0.1.0"
description = "Compare latent spaces with entropic Gromov-Wasserstein, manifold metrics and spectrum-preserving surrogates"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "torch>=2.1", "tqdm>=4.60"]

[project.optional-dependencies]
figures = ["matplotlib", "imageio", "pot"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
